[project]
name = "legal-rag-assistant"
version = "0.1.0"
description = "Chatbot Agentic RAG Asisten Legal menggunakan LangGraph dan Gemini"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Zada Niam Musthofa", email = "zadaniammusthofa@gmail.com" }
]

# Dependencies Utama Aplikasi
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.52.4",
    "langgraph~=1.2.11",
    "google-genai~=2.22.0",
    "qdrant-client~=1.19.0",
    "fastembed~=0.8.0",
    "psycopg[binary]~=3.3.5",
    "langgraph-checkpoint-postgres~=3.1.2",
    "pydantic-settings~=2.15.0",
    "loguru~=0.7.3",
    "chainlit~=2.12.0",
    "httpx~=0.28.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ragas~=0.4.3",
    "langchain-google-genai~=4.4.0",
    "ruff~=0.16.6",
    "mypy~=2.3.1",
    "pre-commit~=4.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "S", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"test_*.py" = ["S101"]