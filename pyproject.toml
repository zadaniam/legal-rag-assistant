[project]
name = "legal-rag-assistant"
version = "0.1.0"
description = "HR Compliance Chatbot Assistant using LangGraph and Qdrant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Zada Niam Musthofa", email = "zadaniammusthofa@gmail.com" }
]

dependencies = [
    "pydantic-settings~=2.15.0",
]

[project.optional-dependencies]
backend = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.52.4",
    "langgraph~=1.2.11",
    "google-genai~=2.22.0",
    "qdrant-client~=1.19.0",
    "fastembed~=0.8.0",
    "psycopg[binary]~=3.3.5",
    "langgraph-checkpoint-postgres~=3.1.2",
    "loguru~=0.7.3",
    "pymupdf4llm~=1.28.2",
    "pdfplumber~=0.11.10",
]
frontend = [
    "chainlit~=2.12.0",
    "httpx~=0.28.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ragas~=0.4.3",
    "langchain-google-genai~=4.4.0",
    "ruff~=0.16.6",
    "mypy~=2.3.1",
    "pre-commit~=4.6.2",
    "pytest-mock~=3.17.0",
    "pytest-cov~=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/main.py",
    "src/database/init_*.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "src/agent/prompts.py**",
    "evaluation/**",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "B", "UP", "RUF", "S", "D"]
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101","D"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
plugins = [
    "pydantic.mypy"
]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

exclude = [
    '^tests/',
    '^evaluation/',
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
