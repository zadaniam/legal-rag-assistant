name: Continuous Integration - Backend Testing

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/workflows/ci-backend.yml'

jobs:
  quality-and-unit-test:
    name: Lint, Format, and Run Unit Tests
    runs-on: ubuntu-latest

    environment: testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & UV
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Dependencies
        run: make sync-ci

      - name: Cache Pre-commit Environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Pre-commit Checks (Including Hadolint)
        run: make pre-commit-ci

      - name: Run Type Checking (Mypy)
        run: make types

      - name: Execute Unit Tests
        env:
          APP_ENV: ${{ vars.ENVIRONMENT }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          QDRANT_COLLECTION_NAME: ${{ vars.QDRANT_COLLECTION_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          make test-unit
