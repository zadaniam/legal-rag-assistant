name: Deploy Legal RAG Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.chainlit/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-frontend.yml'

env:
  PROJECT_ID: "project-0cb13828-a08a-466a-934"
  REGION: "asia-southeast2"
  GAR_REPO: "legal-rag-assistant"

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'
          service_account: 'github-deployer@project-0cb13828-a08a-466a-934.iam.gserviceaccount.com'
          audience: 'https://iam.googleapis.com/projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}
          flags: '--allow-unauthenticated --network=default --subnet=default --vpc-egress=all-traffic --max-instances=5'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            BACKEND_URL=${{ vars.BACKEND_URL }}
