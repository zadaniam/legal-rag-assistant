name: Deploy Legal RAG Assistant to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "project-0cb13828-a08a-466a-934"
  REGION: "asia-southeast2"
  GAR_REPO: "legal-rag-repo"

jobs:
  deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/352692367446/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@://gserviceaccount.com'

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: 'oauth2access'
          password: ${{ steps.auth.outputs.access_token }}

      # ==============================================================================
      # SEGMEN 1: BUILD & DEPLOY BACKEND (FASTAPI)
      # ==============================================================================
      - name: Build and Push Backend Image
        run: |
          docker build \
            --target backend \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}

      # ==============================================================================
      # SEGMEN 2: BUILD & DEPLOY FRONTEND (CHAINLIT)
      # ==============================================================================
      - name: Build and Push Frontend Image
        run: |
          docker build \
            --target frontend \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            FASTAPI_CHAT_URL=${{ steps.deploy-backend.outputs.url }}/api/v1/chat
