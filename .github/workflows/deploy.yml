name: Deploy Legal RAG Assistant to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "project-0cb13828-a08a-466a-934"
  REGION: "asia-southeast2"
  GAR_REPO: "legal-rag-assistant"

jobs:
  deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'
          service_account: 'github-deployer@project-0cb13828-a08a-466a-934.iam.gserviceaccount.com'
          audience: 'https://iam.googleapis.com/projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # ==============================================================================
      # Aktivasi Engine Buildx untuk Caching
      # ==============================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==============================================================================
      # SEGMEN 1: BUILD & DEPLOY BACKEND (FASTAPI)
      # ==============================================================================
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          flags: '--no-allow-unauthenticated'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}

      # ==============================================================================
      # SEGMEN 2: BUILD & DEPLOY FRONTEND (CHAINLIT)
      # ==============================================================================
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/frontend:${{ github.sha }}
          flags: '--no-allow-unauthenticated'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            FASTAPI_CHAT_URL=${{ steps.deploy-backend.outputs.url }}/api/v1/chat