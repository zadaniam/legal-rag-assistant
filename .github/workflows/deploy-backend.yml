name: Deploy Legal RAG Backend

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: "project-0cb13828-a08a-466a-934"
  REGION: "asia-southeast2"
  GAR_REPO: "legal-rag-assistant"

jobs:
  deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'
          service_account: 'github-deployer@project-0cb13828-a08a-466a-934.iam.gserviceaccount.com'
          audience: 'https://iam.googleapis.com/projects/352692367446/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider-v2'

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: legal-rag-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          flags: '--no-allow-unauthenticated --ingress=internal --max-instances=5'
          env_vars: |
            APP_ENV=${{ vars.ENVIRONMENT }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LANGSMITH_TRACING=${{ vars.LANGSMITH_TRACING }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT }}
          secrets: |
            QDRANT_URL=QDRANT_URL:latest
            POSTGRES_URL=POSTGRES_URL:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            QDRANT_API_KEY=QDRANT_API_KEY:latest
            LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest
